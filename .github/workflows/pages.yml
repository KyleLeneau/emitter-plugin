# Simple workflow for deploying static content to GitHub Pages
name: Deploy Github Pages

on:
  # Runs on pushes targeting the default branch, but only when schema or
  # landing-page content actually changed
  push:
    branches: ["main"]
    paths:
      - "schema/**"
      - "docs/pages/**"

  # Runs whenever a new GitHub release is published
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab, regardless
  # of what changed
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Builds the plugin manifests file (one entry per published GitHub release) from
  # the GitHub API. See docs/adr/003-github-manifests.md.
  build-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build plugin manifests
        uses: ./.github/actions/build-manifests
        with:
          output_path: manifests-output/manifests
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload manifests artifact
        uses: actions/upload-artifact@v6
        with:
          name: plugin-manifests
          path: manifests-output/manifests
          if-no-files-found: error

  # Generates the AsyncAPI docs and stages them alongside the landing page
  build-pages:
    needs: build-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install asyncapi CLI
        run: npm install -g @asyncapi/cli

      - name: Generate docs
        run: ./schema/build.sh docs

      - name: Copy docs into pages directory
        run: |
          mkdir -p docs/pages/docs
          cp -r build/docs/. docs/pages/docs/

      - name: Download plugin manifests
        uses: actions/download-artifact@v7
        with:
          name: plugin-manifests
          path: docs/pages/plugins

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/pages'

  deploy:
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
