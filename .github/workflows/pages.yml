# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Github Pages

on:
  # Runs on pushes targeting the default branch, but only when schema or
  # landing-page content actually changed
  push:
    branches: ["main"]
    paths:
      - "schema/**"
      - "docs/pages/**"

  # Runs whenever a new GitHub release is published
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab, regardless
  # of what changed
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Generates the AsyncAPI docs and stages them alongside the landing page
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install asyncapi CLI
        run: npm install -g @asyncapi/cli

      - name: Generate docs
        run: ./schema/build.sh docs

      - name: Copy docs into pages directory
        run: |
          mkdir -p docs/pages/docs
          cp -r build/docs/. docs/pages/docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/pages'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
