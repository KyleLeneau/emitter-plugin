      - name: "FlatPanel"

  # Focuser ─────────────────────────────────────────────────────────────────
  sendFocuserDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/focuserDeviceInfo"
    tags:
      - name: "Focuser"

  # Guider ──────────────────────────────────────────────────────────────────
  sendGuiderDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/guiderDeviceInfo"
    tags:
      - name: "Guider"

  # Mount ───────────────────────────────────────────────────────────────────
  sendMountDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/mountDeviceInfo"
    tags:
      - name: "Mount"
  sendMountMoveEvent:
    action: send
    channel:
      $ref: "#/channels/mountMove"
    tags:
      - name: "Mount"
  sendMountFlipEvent:
    action: send
    channel:
      $ref: "#/channels/mountFlip"
    tags:
      - name: "Mount"

  # Rotator ─────────────────────────────────────────────────────────────────
  sendRotatorDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/rotatorDeviceInfo"
    tags:
      - name: "Rotator"

  # Safety ──────────────────────────────────────────────────────────────────
  sendSafetyDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/safetyDeviceInfo"
    tags:
      - name: "Safety"

  sendSafetyChangeEvent:
    action: send
    channel:
      $ref: "#/channels/safetyChange"
    tags:
      - name: "Safety"

  # Switch ──────────────────────────────────────────────────────────────────
  sendSwitchDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/switchDeviceInfo"
    tags:
      - name: "Switch"

  # Weather ─────────────────────────────────────────────────────────────────
  sendWeatherDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/weatherDeviceInfo"
    tags:
      - name: "Weather"

  # Imaging ─────────────────────────────────────────────────────────────────

  # Profile ─────────────────────────────────────────────────────────────────

  # Sequence ────────────────────────────────────────────────────────────────

  # TargetScheduler ─────────────────────────────────────────────────────────


# ─── Components ────────────────────────────────────────────────────────────
components:

  parameters:
    InstanceId:
      description: Lowercased machine hostname of the PC running NINA

  messages:
    # Common Device ───────────────────────────────────────────────────────────
    DeviceConnectionEvent:
      title: DeviceConnectionEvent
      summary: Event when a device connects or disconnects in nina
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.device.connection"
              data:
                $ref: "./schemas/device_connect_data.yaml"

    # Camera ──────────────────────────────────────────────────────────────────
    CameraDeviceInfoEvent:
      title: CameraDeviceInfoEvent
      summary: Periodic Camera device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.camera.device-info"
              data:
                $ref: "./schemas/camera_data.yaml"

    # Dome ────────────────────────────────────────────────────────────────────
    DomeDeviceInfoEvent:
      title: DomeDeviceInfoEvent
      summary: Periodic dome device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.dome.device-info"
              data:
                $ref: "./schemas/dome_data.yaml"
    DomeShutterEvent:
      title: DomeShutterEvent
      summary: Data about the dome shutter changing state
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.dome.device-info"
              data:
                $ref: "./schemas/dome_shutter_data.yaml"

    # FilterWheel ─────────────────────────────────────────────────────────────
    FilterWheelDeviceInfoEvent:
      title: FilterWheelDeviceInfoEvent
      summary: Periodic filter wheel device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.filter-wheel.device-info"
              data:
                $ref: "./schemas/filter_wheel_data.yaml"

    # FlatPanel ───────────────────────────────────────────────────────────────
    FlatPanelDeviceInfoEvent:
      title: FlatPanelDeviceInfoEvent
      summary: Periodic flat panel device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.flat-panel.device-info"
              data:
                $ref: "./schemas/flat_panel_data.yaml"

    # Focuser ─────────────────────────────────────────────────────────────────
    FocuserDeviceInfoEvent:
      title: FocuserDeviceInfoEvent
      summary: Periodic focuser device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.focuser.device-info"
              data:
                $ref: "./schemas/focuser_data.yaml"

    # Guider ──────────────────────────────────────────────────────────────────
    GuiderDeviceInfoEvent:
      title: GuiderDeviceInfoEvent
      summary: Periodic guider device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.guider.device-info"
              data:
                $ref: "./schemas/guider_data.yaml"

    # Mount ───────────────────────────────────────────────────────────────────
    MountDeviceInfoEvent:
      title: MountDeviceInfoEvent
      summary: Periodic mount device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.mount.device-info"
              data:
                $ref: "./schemas/mount_data.yaml"
    MountMoveEvent:
      title: MountMoveEvent
      summary: Event when the mount moves
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.mount.move"
              data:
                $ref: "./schemas/mount_move_data.yaml"
    MountFlipEvent:
      title: MountFlipEvent
      summary: Event when the mount does a meridian flip
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.mount.flip"
              data:
                $ref: "./schemas/mount_flip_data.yaml"

    # Rotator ─────────────────────────────────────────────────────────────────
    RotatorDeviceInfoEvent:
      title: RotatorDeviceInfoEvent
      summary: Periodic rotator device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.rotator.device-info"
              data:
                $ref: "./schemas/rotator_data.yaml"

    # Saftey -─────────────────────────────────────────────────────────────────
    SafetyDeviceInfoEvent:
      title: SafetyDeviceInfoEvent
      summary: Periodic safety monitor readings
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.safety-monitor.device-info"
              data:
                $ref: "./schemas/safety_data.yaml"

    SafetyChangeEvent:
      title: SafetyChangeEvent
      summary: Event when is_safe changes
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.safety-monitor.is-safe"
              data:
                $ref: "./schemas/safety_change_data.yaml"

    # Switch ──────────────────────────────────────────────────────────────────
    SwitchDeviceInfoEvent:
      title: SwitchDeviceInfoEvent
      summary: Periodic switch device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.switch.device-info"
              data:
                $ref: "./schemas/switch_data.yaml"

    # Weather ─────────────────────────────────────────────────────────────────
    WeatherDeviceInfoEvent:
      title: WeatherDeviceInfoEvent
      summary: Periodic weather station readings
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.weather.device-info"
              data:
                $ref: "./schemas/weather_data.yaml"

    # Imaging ─────────────────────────────────────────────────────────────────
    # Profile ─────────────────────────────────────────────────────────────────
