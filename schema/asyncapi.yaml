asyncapi: 3.0.0
defaultContentType: application/cloudevents+json

info:
  title: Emitter Event Models
  version: "0.2.0"
  description: |
    Events published by the NINA astrophotography software plugin over NATS
    using the CloudEvents 1.0 structured content mode.

    Subject pattern: `nina.{instanceId}.{domain}.{eventType}`

    The `instanceId` is the lowercased machine hostname of the PC running NINA.
    Each NATS message body is a complete CloudEvent JSON object. The `data` field
    contains the domain-specific payload defined in the schemas below.

    ### CloudEvent field conventions:
    - `type`:   `io.nina.{domain}.{eventType}`  (e.g. `io.nina.device.connection`)
    - `source`: `//nina/{instanceId}`
    - `id`:     UUID generated per event
    - `time`:   UTC timestamp of event production

    ### Navigating This Document:
    - **Operations** - These are the topics or subjects messages are sent on.
    - **Messages** - Operations push 1 or more message type. Each message is a CloudEvent
    wrapper with a structured Data type.
    - **Tags** - Tags in the sidebar group related operations into a domain.
  tags:
    - name: "Device"
    - name: "Camera"
    - name: "Dome"
    - name: "FilterWheel"
    - name: "FlatPanel"
    - name: "Focuser"
    - name: "Guider"
    - name: "Mount"
    - name: "Rotator"
    - name: "SafetyMonitor"
    - name: "Switch"
    - name: "Weather"
    - name: "Imaging"
    - name: "Profile"
    - name: "Sequence"
    - name: "TargetScheduler"


# ─── Channels (list of topics) ─────────────────────────────────────────────
channels:
  # Common Device ───────────────────────────────────────────────────────────
  deviceConnection:
    address: "nina.{instanceId}.device.connection"
    description: General device connect and disconnect channel for all device types
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      DeviceConnectionEvent:
        $ref: "#/components/messages/DeviceConnectionEvent"

  # Camera ──────────────────────────────────────────────────────────────────
  cameraDeviceInfo:
    address: "nina.{instanceId}.camera.device-info"
    description: Periodic data about the camera
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      CameraDeviceInfoEvent:
        $ref: "#/components/messages/CameraDeviceInfoEvent"

  # Dome ────────────────────────────────────────────────────────────────────
  domeDeviceInfo:
    address: "nina.{instanceId}.dome.device-info"
    description: Periodic data about the dome
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      DomeDeviceInfoEvent:
        $ref: "#/components/messages/DomeDeviceInfoEvent"
  domeShutter:
    address: "nina.{instanceId}.dome.shutter"
    description: Event when the shutter of the dome changes
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      DomeDeviceInfoEvent:
        $ref: "#/components/messages/DomeShutterEvent"

  # FilterWheel ─────────────────────────────────────────────────────────────
  filterWheelDeviceInfo:
    address: "nina.{instanceId}.filter-wheel.device-info"
    description: Periodic data about the filter wheel
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      FilterWheelDeviceInfoEvent:
        $ref: "#/components/messages/FilterWheelDeviceInfoEvent"

  # FlatPanel ───────────────────────────────────────────────────────────────
  flatPanelDeviceInfo:
    address: "nina.{instanceId}.flat-panel.device-info"
    description: Periodic data about the flat panel
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      FlatPanelDeviceInfoEvent:
        $ref: "#/components/messages/FlatPanelDeviceInfoEvent"

  # Focuser ─────────────────────────────────────────────────────────────────
  focuserDeviceInfo:
    address: "nina.{instanceId}.focuser.device-info"
    description: Periodic data about the Focuser
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      FocuserDeviceInfoEvent:
        $ref: "#/components/messages/FocuserDeviceInfoEvent"

  # Guider ──────────────────────────────────────────────────────────────────
  guiderDeviceInfo:
    address: "nina.{instanceId}.guider.device-info"
    description: Periodic data about the Guider
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      GuiderDeviceInfoEvent:
        $ref: "#/components/messages/GuiderDeviceInfoEvent"

  # Mount ───────────────────────────────────────────────────────────────────
  mountDeviceInfo:
    address: "nina.{instanceId}.mount.device-info"
    description: Periodic data about the Mount
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      MountDeviceInfoEvent:
        $ref: "#/components/messages/MountDeviceInfoEvent"
  mountMove:
    address: "nina.{instanceId}.mount.move"
    description: Event when the mount moves
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      MountMoveEvent:
        $ref: "#/components/messages/MountMoveEvent"
  mountFlip:
    address: "nina.{instanceId}.mount.flip"
    description: Event when the mount does a meridian flip
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      MountMoveEvent:
        $ref: "#/components/messages/MountFlipEvent"

  # Rotator ─────────────────────────────────────────────────────────────────
  rotatorDeviceInfo:
    address: "nina.{instanceId}.rotator.device-info"
    description: Periodic data about the Roatator
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      RotatorDeviceInfoEvent:
        $ref: "#/components/messages/RotatorDeviceInfoEvent"

  # Saftey -─────────────────────────────────────────────────────────────────
  safetyDeviceInfo:
    address: "nina.{instanceId}.safety-monitor.device-info"
    description: Periodic data about the safety monitor
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      safetyDeviceInfoEvent:
        $ref: "#/components/messages/SafetyDeviceInfoEvent"

  safetyChange:
    address: "nina.{instanceId}.safety-monitor.is-safe"
    description: Updates with the saftey monitor value changes
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      safetyChangeEvent:
        $ref: "#/components/messages/SafetyChangeEvent"

  # Switch ──────────────────────────────────────────────────────────────────
  switchDeviceInfo:
    address: "nina.{instanceId}.switch.device-info"
    description: Periodic data about the Switch
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      SwitchDeviceInfoEvent:
        $ref: "#/components/messages/SwitchDeviceInfoEvent"

  # Weather ─────────────────────────────────────────────────────────────────
  weatherDeviceInfo:
    address: "nina.{instanceId}.weather.device-info"
    description: Periodic weather station sensor readings
    parameters:
      instanceId:
        $ref: "#/components/parameters/InstanceId"
    messages:
      weatherDeviceInfoEvent:
        $ref: "#/components/messages/WeatherDeviceInfoEvent"

  # Imaging ─────────────────────────────────────────────────────────────────
  # Profile ─────────────────────────────────────────────────────────────────
  # Sequence ────────────────────────────────────────────────────────────────
  # TargetScheduler ─────────────────────────────────────────────────────────

# ─── Operations (list of events pushed on topics) ───────────────────────────
operations:
  # Common Device ───────────────────────────────────────────────────────────
  sendDeviceConnectionEvent:
    action: send
    channel:
      $ref: "#/channels/deviceConnection"
    tags:
      - name: "Device"

  # Camera ──────────────────────────────────────────────────────────────────
  sendCameraDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/cameraDeviceInfo"
    tags:
      - name: "Camera"

  # Dome ────────────────────────────────────────────────────────────────────
  sendDomeDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/domeDeviceInfo"
    tags:
      - name: "Dome"
  sendDomeShutterEvent:
    action: send
    channel:
      $ref: "#/channels/domeShutter"
    tags:
      - name: "Dome"

  # FilterWheel ─────────────────────────────────────────────────────────────
  sendFilterWheelDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/filterWheelDeviceInfo"
    tags:
      - name: "FilterWheel"

  # FlatPanel ───────────────────────────────────────────────────────────────
  sendFlatPanelDeviceInfoEvent:
    action: send
    channel:
      $ref: "#/channels/flatPanelDeviceInfo"
