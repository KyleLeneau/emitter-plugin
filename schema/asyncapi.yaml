  # Camera ──────────────────────────────────────────────────────────────────


  # Telescope ───────────────────────────────────────────────────────────────


  # Imaging ─────────────────────────────────────────────────────────────────


# ─── Operations (list of events pushed on topics) ───────────────────────────
operations:
  # Common Device ───────────────────────────────────────────────────────────
  publishDeviceConnectionEvent:
    action: send
    channel:
      $ref: "#/channels/deviceConnection"
    tags:
      - name: "Device"

# ─── Components ──────────────────────────────────────────────────────────────
components:

  parameters:
    InstanceId:
      description: Lowercased machine hostname of the PC running NINA

  messages:
    DeviceConnectionEvent:
      title: DeviceConnectionEvent
      summary: Event when a device connects or disconnects in nina
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.device.connection"
              data:
                $ref: "./schemas/device_connect_data.yaml"

