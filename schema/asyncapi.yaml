# ─── Components ────────────────────────────────────────────────────────────
components:

  parameters:
    InstanceId:
      description: Lowercased machine hostname of the PC running NINA

  messages:
    # Common Device ───────────────────────────────────────────────────────────
    DeviceConnectionEvent:
      title: DeviceConnectionEvent
      summary: Event when a device connects or disconnects in nina
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.device.connection"
              data:
                $ref: "./schemas/device_connect_data.yaml"

    # Camera ──────────────────────────────────────────────────────────────────
    CameraDeviceInfoEvent:
      title: CameraDeviceInfoEvent
      summary: Periodic Camera device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.camera.device-info"
              data:
                $ref: "./schemas/camera_data.yaml"
    CameraErrorEvent:
      title: CameraErrorEvent
      summary: Event when the camera encounters an error
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.camera.error"
              data:
                $ref: "./schemas/camera_error_data.yaml"

    # Dome ────────────────────────────────────────────────────────────────────
    DomeDeviceInfoEvent:
      title: DomeDeviceInfoEvent
      summary: Periodic dome device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.dome.device-info"
              data:
                $ref: "./schemas/dome_data.yaml"
    DomeShutterEvent:
      title: DomeShutterEvent
      summary: Data about the dome shutter changing state
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.dome.device-info"
              data:
                $ref: "./schemas/dome_shutter_data.yaml"

    # FilterWheel ─────────────────────────────────────────────────────────────
    FilterWheelDeviceInfoEvent:
      title: FilterWheelDeviceInfoEvent
      summary: Periodic filter wheel device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.filter-wheel.device-info"
              data:
                $ref: "./schemas/filter_wheel_data.yaml"
    FilterWheelChangeEvent:
      title: FilterWheelChangeEvent
      summary: Event when the wheel changes filters
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.filter-wheel.change"
              data:
                $ref: "./schemas/filter_wheel_change_data.yaml"

    # FlatPanel ───────────────────────────────────────────────────────────────
    FlatPanelDeviceInfoEvent:
      title: FlatPanelDeviceInfoEvent
      summary: Periodic flat panel device info
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.flat-panel.device-info"
              data:
                $ref: "./schemas/flat_panel_data.yaml"
    FlatPanelLEDEvent:
      title: FlatPanelLEDEvent
      summary: Event when the flat panel led toggles
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.flat-panel.light"
              data:
                $ref: "./schemas/flat_panel_led_data.yaml"
    FlatPanelStateEvent:
      title: FlatPanelStateEvent
      summary: Event when the flat panel opens or closes
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.flat-panel.state"
              data:
                $ref: "./schemas/flat_panel_state_data.yaml"
    FlatPanelValueEvent:
      title: FlatPanelValueEvent
      summary: Event when the flat panel changes brightness
      payload:
        allOf:
          - $ref: "./schemas/cloudevents.json"
          - type: object
            properties:
              type:
                const: "io.nina.flat-panel.value"
              data:
                $ref: "./schemas/flat_panel_value_data.yaml"

    # Focuser ─────────────────────────────────────────────────────────────────
