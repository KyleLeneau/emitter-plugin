$schema: "http://json-schema.org/draft-07/schema#"
description: Shared type definitions referenced via $ref from other schemas.
definitions:
  FilterInfo:
    type: object
    description: Info on a specific filter
    properties:
      name:
        type: ["string", "null"]
      offset:
        type: ["number", "null"]
      postion:
        type: ["number", "null"]
      is_af_filter:
        type: boolean
      auto_focus_time:
        type: ["number", "null"]
      auto_focus_binning:
        type: ["string", "null"]
      auto_focus_gain:
        type: ["number", "null"]
      auto_focus_offset:
        type: ["number", "null"]
  ShutterState:
    type: string
    enum:
      - "None"
      - "Open"
      - "Closed"
      - "Opening"
      - "Closing"
      - "Error"
