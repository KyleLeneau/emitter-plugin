$schema: "http://json-schema.org/draft-07/schema#"
description: Shared type definitions referenced via $ref from other schemas.
definitions:
  FilterInfo:
    type: object
    description: Info on a specific filter
    properties:
      name:
        type: ["string", "null"]
      offset:
        type: ["number", "null"]
      postion:
        type: ["number", "null"]
      is_af_filter:
        type: boolean
      auto_focus_time:
        type: ["number", "null"]
      auto_focus_binning:
        type: ["string", "null"]
      auto_focus_gain:
        type: ["number", "null"]
      auto_focus_offset:
        type: ["number", "null"]
  ShutterState:
    type: string
    enum:
      - "None"
      - "Open"
      - "Closed"
      - "Opening"
      - "Closing"
      - "Error"
  CameraState:
    type: string
    enum:
      - "None"
      - "Idle"
      - "Waiting"
      - "Exposing"
      - "Reading"
      - "Download"
      - "Error"
      - "LoadingFile"
  SensorType:
    type: string
    enum:
      - "Monochrome"
      - "Color"
      - "RGGB"
      - "CMYG"
      - "CMYG2"
      - "LRGB"
      - "BGGR"
      - "GBRG"
      - "GRBG"
      - "GRGB"
      - "GBGR"
      - "RGBG"
      - "BGRG"
  BinningMode:
    type: object
    properties:
      x:
        type: integer
      y:
        type: integer
    required:
      - "x"
      - "y"
  RMSError:
    type: object
    properties:
      ra:
        $ref: "common.yaml#/definitions/RMSUnit"
      dec:
        $ref: "common.yaml#/definitions/RMSUnit"
      total:
        $ref: "common.yaml#/definitions/RMSUnit"
      peak_ra:
        $ref: "common.yaml#/definitions/RMSUnit"
      peak_dec:
        $ref: "common.yaml#/definitions/RMSUnit"
    required:
      - "ra"
      - "dec"
      - "total"
      - "peak_ra"
      - "peak_dec"
  RMSUnit:
    type: object
    properties:
      pixel:
        type: number
      arc_seconds:
        type: number
    required:
      - "pixel"
      - "arc_seconds"
  TrackingMode:
    type: string
    enum:
      - "Sidereal"
      - "Lunar"
      - "Solar"
      - "King"
      - "Custom"
      - "Stopped"
  Epoch:
    type: string
    enum:
      - "JNOW"
      - "B1950"
      - "J2000"
      - "J2050"
  PierSide:
    type: string
    enum:
      - "East"
      - "West"
      - "Unknown"
  Coordinates:
    type: object
    properties:
      ra_degrees:
        type: number
      dec_degrees:
        type: number
      epoch:
        $ref: "common.yaml#/definitions/Epoch"
