$schema: "http://json-schema.org/draft-07/schema#"
title: TargetSchedulerNewTargetStartData
type: object
description: Data when the TS planner returns a target plan and the target is ‘new’
properties:
  target_name:
    type: string
  target_end_time:
    type: string
    format: "date-time"
  project_name:
    type: string
  coordinates:
    $ref: "common.yaml#/definitions/Coordinates"
  rotation:
    type: number
  filter:
    type: string
  exposure:
    type: number
  gain:
    type: string
  offset:
    type: string
  binning:
    type: string
