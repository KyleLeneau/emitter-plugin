$schema: "http://json-schema.org/draft-07/schema#"
title: RotatorDeviceInfoData
type: object
description: Periodic Rotator event data
properties:
  connected:
    type: boolean
  can_reverse:
    type: boolean
  reverse:
    type: boolean
  mechanical_position:
    type: number
  position:
    type: number
  step_size:
    type: number
  is_moving:
    type: boolean
  synced:
    type: boolean
required:
  - connected
  - can_reverse
  - reverse
  - is_moving
  - synced
