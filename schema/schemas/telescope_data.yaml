$schema: "http://json-schema.org/draft-07/schema#"
title: TelescopeData
type: object
description: Telescope mount state snapshot
properties:
  connected:
    type: boolean
  slewing:
    type: boolean
  tracking_enabled:
    type: boolean
  right_ascension:
    type: ["number", "null"]
    description: Current RA in decimal hours (0–24); null if unsupported by the device
  declination:
    type: ["number", "null"]
    description: Current Dec in decimal degrees (−90 to +90); null if unsupported by the device
  altitude:
    type: ["number", "null"]
    description: Current altitude in decimal degrees; null if unsupported by the device
  azimuth:
    type: ["number", "null"]
    description: Current azimuth in decimal degrees (0–360); null if unsupported by the device
  site_latitude:
    type: ["number", "null"]
    description: Observer latitude in decimal degrees; null if unsupported by the device
  site_longitude:
    type: ["number", "null"]
    description: Observer longitude in decimal degrees; null if unsupported by the device
  site_elevation:
    type: ["number", "null"]
    description: Observer elevation in meters above sea level; null if unsupported by the device
required:
  - connected
  - slewing
  - tracking_enabled
