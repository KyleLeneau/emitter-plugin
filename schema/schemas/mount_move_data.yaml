$schema: "http://json-schema.org/draft-07/schema#"
title: MountMovedData
type: object
description: Event after the mount has moved
properties:
  move_type:
    type: string
    enum:
      - homed
      - parked
      - slewed
      - unparked
  from_coordinates:
    $ref: "common.yaml#/definitions/Coordinates"
  to_coordinates:
    $ref: "common.yaml#/definitions/Coordinates"
required:
  - move_type
