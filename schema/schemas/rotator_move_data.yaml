$schema: "http://json-schema.org/draft-07/schema#"
title: RotatorMovedData
type: object
description: Event after the rotator has moved
properties:
  event:
    type: string
    enum:
      - moved
      - moved_mechanical
      - synced
  from:
    type: number
  to:
    type: number
required:
  - event
  - from
  - to
