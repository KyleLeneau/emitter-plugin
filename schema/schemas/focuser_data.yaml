$schema: "http://json-schema.org/draft-07/schema#"
title: FocuserDeviceInfoData
type: object
description: Focuser device state
properties:
  connected:
    type: boolean
  position:
    type: integer
  step_size:
    type: number
  temperature:
    type: number
  is_moving:
    type: boolean
  is_settling:
    type: boolean
  temp_comp:
    type: boolean
  temp_comp_available:
    type: boolean
required:
  - connected
  - is_moving
  - is_settling
