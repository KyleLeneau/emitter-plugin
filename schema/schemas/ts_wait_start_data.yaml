type: object
description: Data when a the target scheduler enter a wait period
properties:
  wait_end_time:
    type: string
    format: "date-time"
  secs_till_next_target:
    type: integer
  project_name:
    type: string
  target_name:
    type: string
  coordinates:
    $ref: "common.yaml#/definitions/Coordinates"
  rotation:
    type: number
