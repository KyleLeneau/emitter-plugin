$schema: "http://json-schema.org/draft-07/schema#"
title: ImageSavedData
type: object
description: Data when the a new image is taken/saved
properties:
  file_path:
    type: string
  file_type:
    type: string
  image_type:
    type: string
  is_bayered:
    type: boolean
  pixel_height:
    type: integer
  pixel_width:
    type: integer
  filter:
    type: [string, "null"]
  exposure_duration:
    type: number
  image_statistics:
    type: object
    properties:
      bit_depth:
        type: integer
      stdev:
        type: number
      mean:
        type: number
      median:
        type: number
      median_abs_dev:
        type: number
      max:
        type: integer
      max_occurrences:
        type: number
      min:
        type: integer
      min_occurrences:
        type: number
  star_statistics:
    type: object
    properties:
      hfr:
        type: number
      hfr_std_dev:
        type: number
      detected_stars:
        type: integer
required:
  - file_path
