$schema: "http://json-schema.org/draft-07/schema#"
title: ImagingData
type: object
description: Image capture metadata at the time of save
properties:
  filter:
    type: ["string", "null"]
    description: Filter wheel filter name; null if no filter wheel
  target_name:
    type: ["string", "null"]
    description: Imaging target name from the sequence; null if not set
  exposure_time:
    type: number
    description: Exposure duration in seconds
  gain:
    type: integer
    description: Camera gain; −1 if not applicable
  offset:
    type: integer
    description: Camera offset; −1 if not applicable
  image_type:
    type: ["string", "null"]
    description: "Image type — LIGHT, DARK, FLAT, BIAS, etc.; null if unknown"
  exposure_number:
    type: integer
    description: Sequential exposure number within the sequence
required:
  - exposure_time
  - gain
  - offset
  - exposure_number
