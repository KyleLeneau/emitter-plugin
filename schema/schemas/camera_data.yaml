$schema: "http://json-schema.org/draft-07/schema#"
title: CameraData
type: object
description: Camera device state snapshot
properties:
  connected:
    type: boolean
  is_exposing:
    type: boolean
  cooler_on:
    type: boolean
  cooler_power:
    type: ["number", "null"]
    description: Cooler power as a percentage (0–100); null if unsupported by the device
  temperature:
    type: ["number", "null"]
    description: Sensor temperature in degrees Celsius; null if unsupported by the device
  temperature_set_point:
    type: ["number", "null"]
    description: Target cooler temperature in degrees Celsius; null if unsupported by the device
  last_download_time:
    type: number
    description: Duration of last image download in seconds
  exposure_end_time:
    type: ["string", "null"]
    format: date-time
    description: UTC time when the current or last exposure ends; null if none
required:
  - connected
  - is_exposing
  - cooler_on
  - last_download_time
