$schema: "http://json-schema.org/draft-07/schema#"
title: FocuserChangeData
type: object
description: Event data when the user or auto focus runs
properties:
  focus_event:
    type: string
    enum:
      - AutoFocusStart
      - AutoFocusEnd
      - ManualFocus
  filter:
    type: string
  timestamp:
    type: string
    format: "date-time"
  temperature:
    type: number
  postion:
    type: number
required:
  - focus_event
