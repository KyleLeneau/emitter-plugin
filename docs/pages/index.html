<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emitter</title>
  <meta name="description" content="Emitter — a NINA plugin that emits cloud-event wrapped data structures to multiple backends." />
  <link rel="icon" type="image/jpeg" href="emitter_icon.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  </style>
  <!-- Amplitude Analytics -->
  <script src="https://cdn.amplitude.com/script/9d9b9314bfad1c268638504c4c57c7d3.js"></script>
  <script>
    window.amplitude.init('9d9b9314bfad1c268638504c4c57c7d3', {
      autocapture: { pageViews: true, sessions: true },
    });
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-6">
  <main class="w-full max-w-xl text-center">
    <p class="text-sm font-medium uppercase tracking-[0.3em] text-slate-500 mb-3">NINA Plugin</p>

    <h1 class="text-5xl sm:text-6xl font-bold tracking-tight text-white mb-4">
      Emitter
    </h1>

    <img
      src="emitter_icon.jpg"
      alt="Emitter icon"
      class="w-80 h-auto mx-auto mb-6 shadow-lg shadow-indigo-950/50 ring-1 ring-slate-800"
    />

    <p class="text-slate-400 text-base sm:text-lg mb-8">
      Emits cloud-event wrapped data structures to multiple backends.
    </p>

    <a
      href="mailto:your-email@example.com"
      data-amp-label="Email"
      class="inline-flex items-center gap-2 text-slate-400 hover:text-slate-200 transition-colors mb-10 hidden"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0-.828.672-1.5 1.5-1.5h16.5c.828 0 1.5.672 1.5 1.5v10.5a1.5 1.5 0 0 1-1.5 1.5H3.75a1.5 1.5 0 0 1-1.5-1.5V6.75Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="m3 7 8.445 6.34a1.5 1.5 0 0 0 1.81 0L21.75 7" />
      </svg>
      <span class="text-sm">your-email@example.com</span>
    </a>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a
        href="docs/index.html"
        data-amp-label="Event Docs"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 transition-colors shadow-lg shadow-indigo-950/50"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
        </svg>
        Event Docs
      </a>

      <a
        href="https://github.com/KyleLeneau/emitter-plugin/releases"
        data-amp-label="GitHub Releases"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-100 font-medium px-6 py-3 transition-colors border border-slate-700"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.58.24 2.75.12 3.04.74.8 1.19 1.82 1.19 3.08 0 4.42-2.7 5.39-5.26 5.68.42.36.78 1.07.78 2.16 0 1.56-.01 2.82-.01 3.2 0 .31.21.66.79.55A10.51 10.51 0 0 0 23.5 12c0-6.35-5.15-11.5-11.5-11.5Z"/>
        </svg>
        GitHub Releases
      </a>

      <a
        href="https://github.com/KyleLeneau/emitter-plugin"
        data-amp-label="GitHub Repo"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-100 font-medium px-6 py-3 transition-colors border border-slate-700"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.58.24 2.75.12 3.04.74.8 1.19 1.82 1.19 3.08 0 4.42-2.7 5.39-5.26 5.68.42.36.78 1.07.78 2.16 0 1.56-.01 2.82-.01 3.2 0 .31.21.66.79.55A10.51 10.51 0 0 0 23.5 12c0-6.35-5.15-11.5-11.5-11.5Z"/>
        </svg>
        GitHub Repo
      </a>
    </div>

    <div class="rounded-lg border border-slate-800 bg-slate-900/60 px-5 py-4 mt-8 text-left">
      <p class="text-sm font-medium text-slate-200 mb-2">
        Add as a Plugin Repository in NINA
      </p>
      <p class="text-sm text-slate-400 mb-3">
        In NINA, go to <span class="text-slate-300">Options &rarr; Plugins &rarr; Plugin Repositories</span> and add:
      </p>
      <div class="flex items-center gap-2">
        <code id="repo-url" class="flex-1 truncate rounded-md bg-slate-950 border border-slate-800 px-3 py-2 text-sm text-indigo-300">
          https://kyleleneau.github.io/emitter-plugin/
        </code>
        <button
          type="button"
          data-amp-label="Copy Repo URL"
          onclick="navigator.clipboard.writeText(document.getElementById('repo-url').textContent.trim()); this.textContent='Copied!'; setTimeout(() => this.textContent='Copy', 1500);"
          class="shrink-0 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-100 text-sm font-medium px-3 py-2 transition-colors border border-slate-700"
        >
          Copy
        </button>
      </div>
    </div>

  </main>

  <script>
    // Track clicks on labeled buttons/links so we can see where visitors go.
    document.querySelectorAll('[data-amp-label]').forEach((el) => {
      el.addEventListener('click', () => {
        window.amplitude.track('Button Click', {
          label: el.getAttribute('data-amp-label'),
          href: el.getAttribute('href') || null,
        });
      });
    });
  </script>
</body>
</html>
